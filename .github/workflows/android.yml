name: Android APK

on:
  push:
    paths-ignore:
      - '.m1/**'
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-check-reports
          path: app/build/reports/
